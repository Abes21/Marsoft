{% extends 'base.html' %}
{% block title %}Logowanie{% endblock %}
{% block content %}
  <div style="max-width: 380px; margin: 60px auto;">
    <h1>Zaloguj się</h1>

    {% if form.errors %}
      <p style="color:#b00020;">Nieprawidłowy login lub hasło.</p>
    {% endif %}

    <form method="post">
      {% csrf_token %}
      <p>
        <label for="id_username">Login</label><br>
        <input type="text" name="username" id="id_username" required autofocus>
      </p>
      <p>
        <label for="id_password">Hasło</label><br>
        <input type="password" name="password" id="id_password" required>
      </p>
      <button type="submit">Zaloguj</button>
    </form>
  </div>
{% endblock %}
